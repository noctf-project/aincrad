[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
axum = "0.8"
clap = "4"
hmac = "0.13"
k8s-controller = "0.12"
k8s-openapi = "0.28"
kube = "4.2.0"
kube-lease-manager = "0.12"
rand = "0.10"
schemars = "1.2"
serde = "1"
serde_json = "1"
sha2 = "0.11"
siphasher = "1"
thiserror = "2"
tokio = "1"
tower = "0.5"
tracing = "0.1"


[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Suppress noisy pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
similar_names = "allow"