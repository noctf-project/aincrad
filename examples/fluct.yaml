# TLS Route
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: test-web-route
  namespace: kubectf-challenges
spec:
  backend:
    host: example.com
    port: 80
  secret: testing
  tls:
    key: any-entropy2
---
# TCP Route with auto-allocated port
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: test-pwn-auto-port
  namespace: kubectf-challenges
spec:
  backend:
    host: example.com
    port: 80
  port: 0
---
# TCP Route with fixed port
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: test-pwn-fixed-port
  namespace: kubectf-challenges
spec:
  backend:
    host: example.com
    port: 80
  port: 20000
