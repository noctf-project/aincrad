apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: kubectf-challenges
  labels:
    app: whoami
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:v1.10.1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: kubectf-challenges
spec:
  clusterIP: None
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: whoami
---
# TLS Route
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: whoami-tls
  namespace: kubectf-challenges
spec:
  backend:
    host: whoami
    port: 80
  tls:
    prefix: whoami
---
# TCP Route with auto-allocated port
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: whoami-auto
  namespace: kubectf-challenges
spec:
  backend:
    host: whoami
    port: 80
  targetPort: 0
---
# TCP Route with fixed port
apiVersion: aincrad.noctf.dev/v1
kind: CTFRoute
metadata:
  name: whoami-fixed
  namespace: kubectf-challenges
spec:
  backend:
    host: whoami
    port: 80
  targetPort: 20000
