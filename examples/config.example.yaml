# Namespaces to watch for Instance and Template resources.
# If empty or omitted, watches all namespaces.
namespaces:
  - challenges

# Namespace where Cardinal's leader election lease resides.
# Defaults to the controller pod's namespace if omitted.
systemNamespace: cardinal-system

# Routing and Ingress configuration
routing:
  # Base domain suffix for TLS routes and default host in status
  hostnameSuffix: c.example.com

  # Port for shared external TLS listener
  tlsPort: 443

  # Secret seed for deterministic, unguessable TLS subdomain derivation
  seed: super-secret-random-seed-value

  # External IP to write into LoadBalancer services for L4 passthrough
  loadBalancerIp: 1.2.3.4

# L4 TCP/UDP port allocation pools
ports:
  # Pinned port ranges allowed in challenge templates
  reserved:
    - 11000-11999
    - 20000-29999

  # Dynamic pool from which Cardinal allocates challenge ports
  auto:
    - 12000-19999
    - 30000-32767
    - 32768-65535

# Image registry aliases
# Images referencing "_challenges/image:tag" get rewritten to "gcr.io/.../image:tag"
imageAliases:
  _challenges: gcr.io/my-ctf-project/challenges

# Template network policy rules
networkPolicies:
  template:
    # Applied when challenge is available (now >= availableAt or availableAt not set)
    available:
      ingress:
        - from:
            - ipBlock:
                cidr: 0.0.0.0/0
            - namespaceSelector:
                matchExpressions:
                  - key: kubernetes.io/metadata.name
                    operator: In
                    values:
                      - infra
                      - envoy-gateway-system
      policyTypes:
        - Ingress
        - Egress
    # Applied when challenge is unavailable (now < availableAt)
    # unavailable:
    #   ingress: []

# Embedded API Server (Optional - for CTFd / external orchestrator integration)
# The HTTP listener address defaults to 0.0.0.0:8080 or can be configured via the LISTEN_ADDR env variable.
# Access requires a configured key below ("no key, no entry").
api:
  # Maximum allowed timestamp clock skew for HTTP request signature verification (in seconds)
  maxClockSkewSeconds: 15

  # Enable Swagger UI and OpenAPI introspection (/swagger-ui, /api-docs/openapi.json)
  swagger: false

  # Keyring for HMAC-SHA256 signature authentication
  keys:
    noctf-prod:
      # Secret key (raw string or "env:VAR_NAME")
      secret: "replace-with-a-secure-hmac-key"
      # Restrict this key to specific namespaces. If omitted or empty, all managed namespaces are allowed.
      namespaces:
        - challenges
