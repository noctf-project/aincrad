[package]
name = "fluct"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
axum = "0.8"
base64 = "0.22"
capnp = "0.27"
capnp-futures = "0.27"
chrono = { version = "0.4", features = ["serde"] }
base32 = "0.5"
clap = { version = "4", features = ["derive"] }
crypto = { version = "0.5", features = ["cipher", "digest"] }
crypto-ops = "0.1"
dashmap = "6"
futures = "0.3"
hmac = "0.13"
tokio-rustls = { version = "0.26", features = ["ring"] }
kube = { version = "4.2.0", features = ["runtime", "derive"] }
kube-lease-manager = "0.12"
k8s-openapi = { version = "0.28", features = ["latest", "schemars"] }
kctf-pow = "2.1"
tracing = { version = "0.1" }
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2", features = ["chrono04"] }
rustls-pemfile = "2"
sha2 = "0.11"
tower = "0.5"
rand = "0.10"

[build-dependencies]
capnpc = "0.27"

[dependencies.gmp-mpfr-sys]
version = "1.6"
default-features = false
features = ["use-system-libs"]