  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CTFRouteSpec via `CustomResource`
        properties:
          spec:
            properties:
              availableAt:
                description: Optional UTC timestamp after which this route becomes active and accessible to players.
                format: date-time
                nullable: true
                type: string
              backend:
                description: Target backend Kubernetes service name and port.
                properties:
                  port:
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    type: integer
                  service:
                    type: string
                required:
                - port
                - service
                type: object
              flag:
                description: Flag string or template string for the challenge route.
                nullable: true
                type: string
              logs:
                default: false
                description: When true, enables logging of player TCP/TLS session traffic.
                type: boolean
              port:
                description: Dedicated TCP port requested for raw TCP routing.
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
              pow:
                description: Optional Proof-of-Work configuration requiring clients to solve a PoW challenge before connecting.
                nullable: true
                properties:
                  difficulty:
                    format: uint64
                    minimum: 0.0
                    type: integer
                  enableAdminBypass:
                    default: false
                    type: boolean
                required:
                - difficulty
                type: object
              requestUid:
                default: false
                description: When true, appends a unique Crockford Base32 hash ID to derived TLS hostnames.
                type: boolean
              secret:
                description: Cryptographic secret used for Proof-of-Work verification and AES flag encryption.
                nullable: true
                type: string
              tls:
                description: Optional TLS SNI routing configuration.
                nullable: true
                properties:
                  prefix:
                    description: Subdomain prefix for the derived TLS hostname (e.g. 'web' in 'web-xxxx.c.noctf.dev'). Defaults to the route metadata name if omitted.
                    maxLength: 48
                    nullable: true
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
            required:
            - backend
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                nullable: true
                properties:
                  tcp:
                    nullable: true
                    properties:
                      host:
                        type: string
                      port:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                  tls:
                    nullable: true
                    properties:
                      host:
                        type: string
                      port:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                type: object
              observedGeneration:
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: CTFRoute
        type: object
