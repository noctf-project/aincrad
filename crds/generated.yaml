apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ctfinstance-metadata
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - aincrad.noctf.dev
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ctfinstances
  validations:
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/restartedAt'' in object.metadata.annotations) || !format.datetime().validate(string(object.metadata.annotations[''aincrad.noctf.dev/restartedAt''])).hasValue()'
    message: annotation 'aincrad.noctf.dev/restartedAt' must be a valid RFC3339 date/time string
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/expiresAt'' in object.metadata.annotations) || !format.datetime().validate(string(object.metadata.annotations[''aincrad.noctf.dev/expiresAt''])).hasValue()'
    message: annotation 'aincrad.noctf.dev/expiresAt' must be a valid RFC3339 date/time string
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/minTemplateGeneration'' in object.metadata.annotations) || object.metadata.annotations[''aincrad.noctf.dev/minTemplateGeneration''].matches(r''^[1-9][0-9]*$'')'
    message: annotation 'aincrad.noctf.dev/minTemplateGeneration' must be a positive integer
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ctfinstance-metadata-binding
spec:
  policyName: ctfinstance-metadata
  validationActions:
  - Deny
