apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ctftemplates.aincrad.noctf.dev
spec:
  group: aincrad.noctf.dev
  names:
    kind: CTFTemplate
    plural: ctftemplates
    singular: ctftemplate
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CTFTemplateSpec via `CustomResource`
        properties:
          spec:
            description: Specification for a reusable CTF challenge workload template.
            properties:
              params:
                default: []
                description: Key-value parameters passed to challenge pods as environment variables or configuration values.
                items:
                  properties:
                    name:
                      maxLength: 32
                      minLength: 1
                      pattern: ^[_a-z0-9]([-_a-z0-9]*[a-z0-9])?$
                      type: string
                    value:
                      type: string
                  required:
                  - name
                  - value
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              pods:
                default: []
                description: List of pod specifications that make up a challenge instance.
                items:
                  properties:
                    allowInternet:
                      default: false
                      type: boolean
                    name:
                      maxLength: 24
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    patchSpec:
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      type: array
                    replicas:
                      default: 1
                      format: int32
                      type: integer
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  - spec
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              routes:
                default: []
                description: List of RouteSpec definitions that expose backend services.
                items:
                  description: Specification for dynamic L4 TCP/UDP and L7 TLS routing.
                  properties:
                    backend:
                      description: Target backend Kubernetes service name, port, and protocol.
                      properties:
                        port:
                          format: uint16
                          maximum: 65535.0
                          minimum: 0.0
                          type: integer
                        protocol:
                          description: Transport protocol for the backend service (TCP or UDP). Defaults to TCP if omitted.
                          enum:
                          - TCP
                          - UDP
                          - null
                          nullable: true
                          type: string
                        service:
                          type: string
                      required:
                      - port
                      - service
                      type: object
                    name:
                      maxLength: 24
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      description: Dedicated external L4 port (0 or omitted for auto-allocation, or fixed port in reserved range). Mutually exclusive with 'tls'.
                      format: uint16
                      maximum: 65535.0
                      minimum: 0.0
                      nullable: true
                      type: integer
                    tls:
                      description: TLS routing configuration (mutually exclusive with 'port').
                      nullable: true
                      properties:
                        prefix:
                          description: Subdomain prefix for the derived TLS hostname (e.g. 'web' in 'web-xxxx.c.noctf.dev'). Defaults to the route metadata name if omitted.
                          maxLength: 48
                          nullable: true
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      type: object
                  required:
                  - backend
                  - name
                  type: object
                  x-kubernetes-validations:
                  - message: Route must specify either 'port' or 'tls', but not both
                    rule: has(self.port) != has(self.tls)
                  - message: TLS routes cannot target a UDP backend
                    rule: '!has(self.tls) || !has(self.backend.protocol) || self.backend.protocol == ''TCP'''
                  - message: Explicit external ports cannot be set; port must be omitted or set to 0
                    rule: '!has(self.port) || self.port == 0'
