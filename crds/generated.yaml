                  service:
                    type: string
                required:
                - port
                - service
                type: object
              flag:
                description: Flag string or template string for the challenge route.
                nullable: true
                type: string
              logs:
                default: false
                description: When true, enables logging of player TCP/TLS session traffic.
                type: boolean
              pow:
                description: Optional Proof-of-Work configuration requiring clients to solve a PoW challenge before connecting.
                nullable: true
                properties:
                  difficulty:
                    format: uint64
                    minimum: 0.0
                    type: integer
                  enableAdminBypass:
                    default: false
                    type: boolean
                required:
                - difficulty
                type: object
              requestUid:
                default: false
                description: Request the team's id in the TCP tunnel.
                type: boolean
              secret:
                description: Cryptographic secret used for Proof-of-Work verification and AES flag encryption.
                nullable: true
                type: string
              tcp:
                description: TCP routing configuration (mutually exclusive with 'tls').
                nullable: true
                properties:
                  port:
                    description: Dedicated TCP port (0 or omitted for auto-allocation, or fixed port in reserved range).
                    format: uint16
                    maximum: 65535.0
                    minimum: 0.0
                    nullable: true
                    type: integer
                type: object
              tls:
                description: TLS routing configuration (mutually exclusive with 'tcp').
                nullable: true
                properties:
                  prefix:
                    description: Subdomain prefix for the derived TLS hostname (e.g. 'web' in 'web-xxxx.c.noctf.dev'). Defaults to the route metadata name if omitted.
                    maxLength: 48
                    nullable: true
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
            required:
            - backend
            type: object
            x-kubernetes-validations:
            - message: Exactly one of 'tcp' or 'tls' must be specified
              rule: has(self.tcp) != has(self.tls)
