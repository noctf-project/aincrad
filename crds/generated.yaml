                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                nullable: true
                properties:
                  tcp:
                    nullable: true
                    properties:
                      host:
                        type: string
                      port:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                    required:
                    - host
                    - port
                    type: object
                  tls:
                    nullable: true
                    properties:
                      host:
                        type: string
                      port:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
