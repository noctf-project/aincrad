apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ctfinstance-annotations
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - aincrad.noctf.dev
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ctfinstances
  validations:
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/restartedAt'' in object.metadata.annotations) || !format.datetime().validate(string(object.metadata.annotations[''aincrad.noctf.dev/restartedAt''])).hasValue()'
    message: annotation 'aincrad.noctf.dev/restartedAt' must be a valid RFC3339 date/time string
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/expiresAt'' in object.metadata.annotations) || !format.datetime().validate(string(object.metadata.annotations[''aincrad.noctf.dev/expiresAt''])).hasValue()'
    message: annotation 'aincrad.noctf.dev/expiresAt' must be a valid RFC3339 date/time string
  - expression: '!has(object.metadata.annotations) || !(''aincrad.noctf.dev/minTemplateGeneration'' in object.metadata.annotations) || object.metadata.annotations[''aincrad.noctf.dev/minTemplateGeneration''].matches(r''^[1-9][0-9]*$'')'
    message: annotation 'aincrad.noctf.dev/minTemplateGeneration' must be a positive integer
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ctfinstance-annotations-binding
spec:
  policyName: ctfinstance-annotations
  validationActions:
  - Deny
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ctfproxyroute-name-format
spec:
  matchConstraints:
    resourceRules:
    - apiGroups:
      - aincrad.noctf.dev
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - ctfproxyroutes
  validations:
  - expression: (object.metadata.name.matches('^p[1-9][0-9]{0,4}$') && int(object.metadata.name.substring(1)) <= 65535) || object.metadata.name.matches('^r[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    message: metadata.name must be 'p<1-65535>' for TCP routes or 'r<route-name>' for hostname routes
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ctfproxyroute-name-format-binding
spec:
  policyName: ctfproxyroute-name-format
  validationActions:
  - Deny
---
