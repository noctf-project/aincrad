apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ctfroute.aincrad.noctf.dev
spec:
  group: aincrad.noctf.dev
  scope: Namespaced
  names:
    plural: ctfroutes
    singular: ctfroute
    kind: CTFRoute
    shortNames:
      - ctfroute
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  flag:
                    type: string
                    minLength: 1
                  availableAt:
                    type: string
                    format: date-time
                  secret:
                    type: string
                  requestUid:
                    type: boolean
                  pow:
                    type: object
                    properties:
                      difficulty:
                        type: integer
                      enableAdminBypass:
                        type: boolean
                    required: [difficulty]
                  backend:
                    type: string
                  logs:
                    type: boolean
                  tls:
                    oneOf:
                      - type: boolean
                      - type: string
                required: [backend]
              status:
                type: object
                properties:
                  observedGeneration:
                    type: integer
                  tlsHostname:
                    type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ctfport.aincrad.noctf.dev
spec:
  group: aincrad.noctf.dev
  scope: Namespaced
  names:
    plural: ctfports
    singular: ctfport
    kind: CTFPort
    shortNames:
      - ctfport
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                route:
                  type: string