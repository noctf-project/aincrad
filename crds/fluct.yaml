apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ctfroutes.aincrad.noctf.dev
spec:
  group: aincrad.noctf.dev
  scope: Namespaced
  names:
    plural: ctfroutes
    singular: ctfroute
    kind: CTFRoute
    shortNames:
      - ctfroute
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
            type: object
            properties:
              spec:
                type: object
                properties:
                  flag:
                    type: string
                    minLength: 1
                  availableAt:
                    type: string
                    format: date-time
                  secret:
                    type: string
                  requestUid:
                    type: boolean
                  pow:
                    type: object
                    properties:
                      difficulty:
                        type: integer
                      enableAdminBypass:
                        type: boolean
                    required: [difficulty]
                  backend:
                    type: string
                  port:
                    type: integer
                  logs:
                    type: boolean
                  tls:
                    type: object
                    properties:
                      key:
                        type: string
                required: [backend]
              status:
                type: object
                properties:
                  observedGeneration:
                    type: integer
                  endpoints:
                    type: object
                    properties:
                      tls:
                        type: object
                        properties:
                          host:
                            type: string
                          port:
                            type: integer
                      tcp:
                        type: object
                        properties:
                          host:
                            type: string
                          port:
                            type: integer